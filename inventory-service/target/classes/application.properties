spring.application.name=inventory-service
server.port=8081

# Where the Forecast Service (AI microservice) runs - externally configurable via FORECAST_SERVICE_URL
forecast.base-url=${FORECAST_SERVICE_URL:http://localhost:8082}

# ==============================================================
# Enterprise Database Integration: MySQL 8.0 (medichain database)
# Overridable via external environment variables (e.g. Docker, Cloud, or CI/CD):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# ==============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/medichain?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Show error messages in the UI
server.error.include-message=always
